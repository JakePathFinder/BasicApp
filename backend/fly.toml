# Fly.io config for the backend (ASP.NET Core weather API).
# Deploy from this directory:  fly deploy
app = "basicapp-backend"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
